[project]
name = "predlog"
version = "0.1.0"
description = "A personal CLI tool for probabilistic prediction tracking and calibration."
readme = "README.md"
authors = [
    { name = "russluber", email = "russelhluber@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10.9",
    "rich>=15.0.0",
    "typer>=0.26.3",
]

[project.scripts]
predlog = "predlog:main"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.15",
]
