[project]
name = "predlog"
version = "0.1.0"
description = "A personal CLI tool for probabilistic prediction tracking and calibration."
readme = "README.md"
authors = [
    { name = "russluber", email = "russelhluber@gmail.com" }
]
requires-python = ">=3.8"
dependencies = [
    "click>=8.1.8,<8.2",
    "matplotlib>=3.7.5,<3.10; python_version < '3.10'",
    "matplotlib>=3.10.9; python_version >= '3.10'",
    "rich>=13.7.1,<15",
    "typer>=0.12.5,<0.13",
]

[project.scripts]
predlog = "predlog:main"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3.5,<9",
    "ruff>=0.15.15",
]
